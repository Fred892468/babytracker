services:
  baby-tracker:
    build: .
    container_name: baby-tracker
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Rome
      DB_PATH: /data/tracker.db
    ports:
      - "127.0.0.1:8123:8000"   # solo locale: va esposto tramite il reverse proxy con HTTPS
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
