<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6a5b8">
<title>Diario pannolino</title>
<style>
  :root { --bg:#fff8f5; --card:#fff; --ink:#3b2f2f; --muted:#8a7a78; --accent:#e0678a; --line:#f0e1dc; --warn:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:env(safe-area-inset-bottom); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:0; }
  h2 { font-size:1rem; margin:0 0 8px; color:var(--muted); font-weight:600; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  header small { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .hidden { display:none !important; }
  .banner { border-radius:12px; padding:10px 12px; margin-bottom:14px; background:#fdecea; color:var(--warn); border:1px solid #f5c6c0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { flex:1 1 auto; min-width:80px; padding:12px 8px; border:2px solid var(--line); background:#fff; border-radius:12px; font-size:1rem; text-align:center; cursor:pointer; color:var(--ink); }
  .chip[aria-pressed="true"] { border-color:var(--accent); background:#fde7ee; font-weight:600; }
  .kinds .chip { font-size:1.05rem; padding:16px 8px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 6px; }
  input[type=text], input[type=password], input[type=datetime-local] { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:1rem; background:#fff; color:var(--ink); }
  button.primary { width:100%; margin-top:14px; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:1.05rem; font-weight:600; cursor:pointer; }
  button.link { background:none; border:0; color:var(--muted); cursor:pointer; font-size:.85rem; text-decoration:underline; padding:4px; }
  .entry { display:flex; justify-content:space-between; gap:8px; padding:10px 0; border-top:1px solid var(--line); }
  .entry:first-child { border-top:0; }
  .entry .meta { color:var(--muted); font-size:.85rem; }
  .entry .note { font-size:.9rem; margin-top:2px; }
  .entry .warn { color:var(--warn); font-weight:600; }
  .day { font-size:.8rem; color:var(--muted); font-weight:600; margin:12px 0 2px; text-transform:capitalize; }
  .del { background:none; border:0; color:var(--muted); font-size:1.2rem; cursor:pointer; align-self:flex-start; }
  .chart { display:flex; align-items:flex-end; gap:4px; height:90px; }
  .bar { flex:1; display:flex; flex-direction:column-reverse; align-items:stretch; height:100%; justify-content:flex-start; position:relative; }
  .bar .seg { background:var(--accent); border-radius:3px 3px 0 0; min-height:0; }
  .bar .lbl { position:absolute; bottom:-18px; left:0; right:0; text-align:center; font-size:.65rem; color:var(--muted); }
  .chartwrap { padding-bottom:20px; }
  .error { color:var(--warn); font-size:.9rem; margin-top:8px; min-height:1.2em; }
  .stat { display:flex; justify-content:space-between; font-size:.95rem; padding:2px 0; }
  .empty { color:var(--muted); text-align:center; padding:12px 0; }
</style>
</head>
<body>
<main>

<section id="login" class="card hidden">
  <h1>Diario pannolino</h1>
  <label for="l-name">Il tuo nome</label>
  <input id="l-name" type="text" maxlength="30" autocomplete="given-name" placeholder="es. Mamma, Papa', Nonna">
  <label for="l-pw">Password famiglia</label>
  <input id="l-pw" type="password" autocomplete="current-password">
  <button class="primary" id="l-btn">Entra</button>
  <div class="error" id="l-err"></div>
</section>

<div id="app" class="hidden">
  <header>
    <div>
      <h1>Diario di <span id="baby"></span></h1>
      <small>Ciao <span id="me"></span> · <button class="link" id="logout">esci</button></small>
    </div>
  </header>

  <div id="alert" class="banner hidden"></div>

  <section class="card">
    <h2>Nuova registrazione</h2>
    <div class="row kinds" id="kinds">
      <button class="chip" data-v="cacca" aria-pressed="true">💩 Cacca</button>
      <button class="chip" data-v="pipi" aria-pressed="false">💧 Pipì</button>
      <button class="chip" data-v="entrambi" aria-pressed="false">💩💧 Entrambi</button>
    </div>
    <div id="details">
      <label>Consistenza</label>
      <div class="row" id="consistency">
        <button class="chip" data-v="liquida" aria-pressed="false">Liquida</button>
        <button class="chip" data-v="molle" aria-pressed="false">Molle</button>
        <button class="chip" data-v="normale" aria-pressed="false">Normale</button>
        <button class="chip" data-v="dura" aria-pressed="false">Dura</button>
      </div>
      <label>Colore</label>
      <div class="row" id="color">
        <button class="chip" data-v="giallo" aria-pressed="false">🟡 Giallo</button>
        <button class="chip" data-v="verde" aria-pressed="false">🟢 Verde</button>
        <button class="chip" data-v="marrone" aria-pressed="false">🟤 Marrone</button>
        <button class="chip" data-v="nero" aria-pressed="false">⚫ Nero</button>
        <button class="chip" data-v="rosso" aria-pressed="false">🔴 Rosso</button>
        <button class="chip" data-v="bianco" aria-pressed="false">⚪ Bianco</button>
      </div>
    </div>
    <label for="f-ts">Quando</label>
    <input id="f-ts" type="datetime-local">
    <label for="f-note">Note (cibo nuovo, farmaci, febbre…)</label>
    <input id="f-note" type="text" maxlength="500">
    <button class="primary" id="save">Salva</button>
    <div class="error" id="f-err"></div>
  </section>

  <section class="card">
    <h2>Ultimi 14 giorni</h2>
    <div class="chartwrap"><div class="chart" id="chart"></div></div>
    <div id="stats" style="margin-top:6px"></div>
  </section>

  <section class="card">
    <h2>Storico</h2>
    <div id="list"></div>
    <div style="text-align:center;margin-top:10px"><a href="/export.csv" class="link" style="color:var(--muted);font-size:.85rem">Scarica tutto (CSV)</a></div>
  </section>
</div>

</main>
<script>
const $ = (s) => document.querySelector(s);
const state = { kind: "cacca", consistency: null, color: null };

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401 && path !== "/api/login") { showLogin(); throw new Error("401"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Errore");
  return data;
}

function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }

function localInputValue(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function bindChips(id, key, toggle) {
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    const v = b.dataset.v;
    state[key] = toggle && state[key] === v ? null : v;
    $(id).querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.v === state[key])));
    if (key === "kind") $("#details").classList.toggle("hidden", v === "pipi");
  });
}
bindChips("#kinds", "kind", false);
bindChips("#consistency", "consistency", true);
bindChips("#color", "color", true);

const KIND_LABEL = { cacca: "💩 Cacca", pipi: "💧 Pipì", entrambi: "💩💧 Cacca + pipì" };

function fmtDay(d) { return d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }); }
function fmtTime(d) { return d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }); }

async function loadList() {
  const rows = await api("/api/entries?days=14");
  const list = $("#list"); list.replaceChildren();
  if (!rows.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "Ancora nessuna registrazione"; list.append(e); return; }
  let lastDay = "";
  for (const r of rows) {
    const d = new Date(r.ts);
    const day = d.toDateString();
    if (day !== lastDay) { lastDay = day; const h = document.createElement("div"); h.className = "day"; h.textContent = fmtDay(d); list.append(h); }
    const el = document.createElement("div"); el.className = "entry";
    const left = document.createElement("div");
    const title = document.createElement("div");
    title.textContent = `${fmtTime(d)} · ${KIND_LABEL[r.kind]}`;
    left.append(title);
    const bits = [r.consistency, r.color].filter(Boolean).join(", ");
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = (bits ? bits + " · " : "") + "da " + r.author;
    if (["rosso", "nero", "bianco"].includes(r.color)) meta.classList.add("warn");
    left.append(meta);
    if (r.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = r.note; left.append(n); }
    const del = document.createElement("button"); del.className = "del"; del.textContent = "×"; del.title = "Elimina";
    del.addEventListener("click", async () => {
      if (!confirm("Eliminare questa registrazione?")) return;
      await api("/api/entries/" + r.id, { method: "DELETE" }); refresh();
    });
    el.append(left, del); list.append(el);
  }
}

async function loadStats() {
  const s = await api("/api/stats");
  const max = Math.max(1, ...s.per_day.map((d) => d.cacca));
  const chart = $("#chart"); chart.replaceChildren();
  for (const d of s.per_day) {
    const bar = document.createElement("div"); bar.className = "bar"; bar.title = `${d.date}: ${d.cacca} cacca, ${d.pipi} pipì`;
    const seg = document.createElement("div"); seg.className = "seg"; seg.style.height = (d.cacca / max * 100) + "%";
    const lbl = document.createElement("div"); lbl.className = "lbl"; lbl.textContent = d.date.slice(8);
    bar.append(seg, lbl); chart.append(bar);
  }
  const tot = s.per_day.reduce((a, d) => a + d.cacca, 0);
  const totP = s.per_day.reduce((a, d) => a + d.pipi, 0);
  const box = $("#stats"); box.replaceChildren();
  const add = (k, v) => { const r = document.createElement("div"); r.className = "stat"; const a = document.createElement("span"); a.textContent = k; const b = document.createElement("strong"); b.textContent = v; r.append(a, b); box.append(r); };
  add("Ultima cacca", s.hours_since_poop == null ? "—" : (s.hours_since_poop < 1 ? "meno di un'ora fa" : Math.round(s.hours_since_poop) + " ore fa"));
  add("Cacca / giorno (media)", (tot / 14).toFixed(1));
  add("Pipì / giorno (media)", (totP / 14).toFixed(1));
  const banner = $("#alert");
  if (s.alert_color) { banner.textContent = `Colore ${s.alert_color.color} registrato di recente: se persiste o hai dubbi, sentire il pediatra.`; banner.classList.remove("hidden"); }
  else banner.classList.add("hidden");
}

const refresh = () => Promise.all([loadList(), loadStats()]);

$("#save").addEventListener("click", async () => {
  $("#f-err").textContent = "";
  try {
    const ts = $("#f-ts").value ? new Date($("#f-ts").value).toISOString() : undefined;
    await api("/api/entries", { method: "POST", body: { kind: state.kind, consistency: state.consistency, color: state.color, note: $("#f-note").value, ts } });
    $("#f-note").value = ""; $("#f-ts").value = localInputValue();
    state.consistency = state.color = null;
    document.querySelectorAll("#consistency .chip, #color .chip").forEach((c) => c.setAttribute("aria-pressed", "false"));
    refresh();
  } catch (e) { $("#f-err").textContent = e.message; }
});

$("#l-btn").addEventListener("click", async () => {
  $("#l-err").textContent = "";
  try { await api("/api/login", { method: "POST", body: { name: $("#l-name").value, password: $("#l-pw").value } }); start(); }
  catch (e) { $("#l-err").textContent = e.message; }
});
$("#l-pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#l-btn").click(); });
$("#logout").addEventListener("click", async () => { await api("/api/logout", { method: "POST" }); showLogin(); });

async function start() {
  try {
    const me = await api("/api/me");
    $("#me").textContent = me.name; $("#baby").textContent = me.baby;
    document.title = "Diario di " + me.baby;
    $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
    $("#f-ts").value = localInputValue();
    await refresh();
  } catch (e) { if (e.message !== "401") console.error(e); }
}
start();
setInterval(() => { if (!$("#app").classList.contains("hidden") && !document.hidden) refresh().catch(() => {}); }, 30000);
</script>
</body>
</html>
